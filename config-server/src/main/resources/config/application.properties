# Shared defaults every OTT microservice picks up from the Config Server
# under the "application" name (Spring Cloud Config's convention for
# config that applies to every client, regardless of its own
# spring.application.name). Per-service overrides go in a file named
# after that service, e.g. config/catalog-service.properties, and win
# over this.

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=localhost:9092

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.datasource.url=jdbc:postgresql://localhost:5432/ott_auth
spring.datasource.username=ott
spring.datasource.password=ott
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
