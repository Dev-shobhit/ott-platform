server.port=8081

spring.application.name=user-auth-service
spring.config.import=optional:configserver:http://localhost:8888,optional:classpath:application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/ott_auth
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:ott}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=7

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
cookie.secure=${COOKIE_SECURE:false}

# Mail (defaults point at Mail pit; override with env vars for a real provider)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
mail.from=${MAIL_FROM:no-reply@ott.local}

# OTP rules
otp.expiry-minutes=5
otp.max-attempts=5
otp.cooldown-seconds=60
otp.max-requests=3
otp.request-window-minutes=10

profile.max-per-user=5