server.port=8081

spring.application.name=user-auth-service
spring.config.import=optional:configserver:http://localhost:8888

# Local default; overridden by Neon DATABASE_URL when set (see common-lib NeonDatasourceEnvironmentPostProcessor)
neon.datasource.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:5432/ott_userauth
spring.datasource.username=${DB_USERNAME:ott}
spring.datasource.password=${DB_PASSWORD:ott}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
