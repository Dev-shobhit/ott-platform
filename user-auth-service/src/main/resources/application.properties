server.port=8081

spring.application.name=user-auth-service
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=jdbc:postgresql://localhost:5432/ott_auth
spring.datasource.username=postgres
spring.datasource.password=sho_2001@

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=7