name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "uat", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # TODO: switch back to `clean verify` once services have real code.
      # `verify` reaches the `package` phase, where spring-boot-maven-plugin's
      # repackage goal needs a main class - every service is still an empty
      # skeleton (no Application.java yet), so `verify` fails on all of them.
      # `compile` still catches real syntax/dependency errors without that
      # requirement.
      - name: Build all modules
        run: mvn -B -ntp clean compile
